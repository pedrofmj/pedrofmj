name: Deployment Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-check:
    name: Determine deployment impact
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine deployment eligibility
        id: check
        shell: bash
        run: |
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" =~ ^(feat|fix)\(.*\): ]]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          fi

  portfolio-check:
    name: Verify portfolio content
    needs: deployment-check
    if: needs.deployment-check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required content
        run: |
          test -s README.md
          test -s docs/development/workflow.md
          test -s docs/development/backlog.md
          test -s docs/development/tracker.md

  deploy-staging:
    name: Deployment placeholder
    needs: [deployment-check, portfolio-check]
    if: needs.deployment-check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Report deployment status
        run: |
          echo "No deployment target is configured for this documentation portfolio."
          echo "Configure the staging environment and deployment command before enabling deployment."
